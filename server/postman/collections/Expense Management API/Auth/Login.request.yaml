$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/api/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 200) {
        const json = pm.response.json();
        pm.collectionVariables.set("accessToken", json.accessToken);
        console.log("Token captured:", json.accessToken);
      }
